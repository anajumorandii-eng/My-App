name: Preservar relatório da auditoria integral

on:
  push:
    branches:
      - 'docs/verificacao-integral-awesome-2026-10-09'
    paths:
      - '.github/workflows/crivo-audit-report.yml'
      - '.github/workflows/crivo-integral-audit.yml'
      - 'src/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  preservar:
    if: github.ref_name == 'docs/verificacao-integral-awesome-2026-10-09'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      AUDIT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar que o código do produto corresponde à versão auditada
        run: |
          git diff --name-only "$AUDIT_SOURCE_SHA" HEAD > /tmp/crivo-report-delta.txt
          node <<'NODE'
          const fs=require('node:fs');
          const files=fs.readFileSync('/tmp/crivo-report-delta.txt','utf8').trim().split('\n').filter(Boolean);
          const invalid=files.filter(file=>!file.startsWith('docs/')&&!['.github/workflows/crivo-audit-report.yml','.github/workflows/crivo-integral-audit.yml'].includes(file));
          if(invalid.length)throw new Error('O produto mudou depois da auditoria: '+invalid.join(', '));
          console.log('Código do produto preservado; '+files.length+' arquivos de documentação/infraestrutura no delta.');
          NODE
      - name: Aguardar conclusão dos seis lotes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
           const headers = { Authorization: 'Bearer '+process.env.GITHUB_TOKEN, Accept: 'application/vnd.github+json' };
           const url='https://api.github.com/repos/anajumorandii-eng/My-App/actions/workflows/crivo-integral-audit.yml/runs?head_sha='+process.env.AUDIT_SOURCE_SHA+'&event=push&per_page=10';
           for(let attempt=0;attempt<100;attempt++) {
             const response=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
             if(!response.ok)throw new Error('Falha ao consultar auditoria: HTTP '+response.status);
             const data=await response.json();
             const run=data.workflow_runs.find(candidate=>candidate.head_sha===process.env.AUDIT_SOURCE_SHA&&candidate.event==='push');
             console.log('Estado da auditoria: '+(run?run.status+' / '+run.conclusion:'aguardando início'));
             if(run?.status==='completed') {
               fs.appendFileSync(process.env.GITHUB_ENV,'AUDIT_RUN_ID='+run.id+'\n');
               console.log('Execução selecionada: '+run.id);
               return;
             }
             await new Promise(resolve=>setTimeout(resolve,45000));
           }
           throw new Error('Auditoria não terminou no limite; não publicar como aprovada.');
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Baixar os artefatos da execução auditada
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.AUDIT_RUN_ID }}
          pattern: crivo-integral-*
          path: work/received
      - name: Consolidar resultados e folhas de contato
        run: |
          node <<'NODE'
          (async function publishAuditReports() {
            const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
            const inventory = JSON.parse(fs.readFileSync('docs/inspecao-visual-613-2026-10-09/inventario-base.json','utf8'));
            const expected = new Set(inventory.map(c=>c.id));
            assert.equal(expected.size,613);
            const root='docs/verificacao-awesome-613-2026-10-09';
            fs.mkdirSync(path.join(root,'execucao'),{recursive:true});
            function walk(dir) {
              if(!fs.existsSync(dir))return [];
              return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):[path.join(dir,e.name)]);
            }
            const configurations=[], byChapter=new Map(inventory.map(c=>[c.id,[]])), gallery=[];
            for (const width of [360,834,1440]) for (const theme of ['light','dark']) {
              const files=walk(path.join('work/received','crivo-integral-'+width+'-'+theme));
              for(const motion of ['reduce','no-preference']) {
                const matches=files.filter(f=>path.basename(f)===motion+'-result.json');
                const summaryFiles=files.filter(f=>path.basename(f)===motion+'-summary.json');
                const rows=matches.length===1?JSON.parse(fs.readFileSync(matches[0],'utf8')):[];
                const summary=summaryFiles.length===1?JSON.parse(fs.readFileSync(summaryFiles[0],'utf8')):null;
                const ids=new Set(rows.map(r=>r.id));
                const valid=rows.every(r=>expected.has(r.id)&&r.width===width&&r.theme===theme&&r.motion===motion&&r.source_commit===process.env.AUDIT_SOURCE_SHA);
                const complete=valid&&rows.length===613&&ids.size===613&&summary?.complete===true;
                const failures=rows.filter(r=>!r.passed);
                const name=width+'-'+theme+'-'+motion+'.json';
                const metadata={width,theme,motion,source_commit:process.env.AUDIT_SOURCE_SHA,run_id:Number(process.env.AUDIT_RUN_ID),complete,actual:rows.length,unique_ids:ids.size,passed:rows.filter(r=>r.passed).length,failed:failures.length,invalid_provenance:!valid,file:'execucao/'+name};
                configurations.push(metadata);
                fs.writeFileSync(path.join(root,'execucao',name),JSON.stringify({metadata,summary,chapters:rows},null,2)+'\n');
                for(const r of rows) {
                  if(byChapter.has(r.id))byChapter.get(r.id).push({width,theme,motion,passed:r.passed===true,result_file:'execucao/'+name});
                }
              }
              if((width===360&&theme==='dark')||(width===1440&&theme==='light')) {
                const destination=path.join(root,'capturas',width+'-'+theme);
                fs.mkdirSync(destination,{recursive:true});
                const sheets=files.filter(f=>f.includes(path.sep+'folhas'+path.sep)&&f.endsWith('.jpg')).sort();
                const nativeDirectory=files.find(f=>path.basename(f)==='reduce-result.json');
                const captured=inventory.map((chapter,index)=>({...chapter,index}))
                  .filter(c=>nativeDirectory&&fs.existsSync(path.join(path.dirname(nativeDirectory),'reduce',String(c.index).padStart(3,'0')+'-'+theme+'.jpg')));
                for(const [i,sheet] of sheets.entries()) {
                  const target=path.join(destination,path.basename(sheet));
                  fs.copyFileSync(sheet,target);
                  gallery.push({width,theme,path:path.relative(root,target),ids:captured.slice(i*8,i*8+8).map(c=>c.id)});
                }
              }
            }
            const complete=configurations.length===12&&configurations.every(c=>c.complete);
            const actual=configurations.reduce((n,c)=>n+c.actual,0);
            const failed=configurations.reduce((n,c)=>n+c.failed,0);
            const technicalStatus=complete?(failed?'findings':'passed'):'incomplete';
            const quality=JSON.parse(fs.readFileSync('docs/visual-personalizado/27-qualidade-visual.json','utf8'));
            const formal={};quality.forEach(row=>formal[row.status]=(formal[row.status]||0)+1);
            const now=new Date().toISOString();
            const manifest={schema_version:1,generated_at_utc:now,source_commit:process.env.AUDIT_SOURCE_SHA,run_id:Number(process.env.AUDIT_RUN_ID),run_url:'https://github.com/anajumorandii-eng/My-App/actions/runs/'+process.env.AUDIT_RUN_ID,status:technicalStatus,expected:7356,actual,failed,complete,configurations,gallery,formal_quality:formal,visual_review_status:'pending',limits:['Chromium, synthetic preferences, no authenticated student data','Initial views and representative control interactions; not every parameter combination','Contact sheets require visual review; do not infer aesthetic or pedagogical approval','Full screenshots remain in original workflow artifacts for three days']};
            fs.writeFileSync(path.join(root,'execucao','manifesto.json'),JSON.stringify(manifest,null,2)+'\n');
            const priorResult=JSON.parse(fs.readFileSync(path.join(root,'resultado-613.json'),'utf8'));
            priorResult.structural_source_commit=priorResult.source_commit;
            priorResult.runtime_source_commit=process.env.AUDIT_SOURCE_SHA;
            priorResult.audited_at_utc=now;
            priorResult.status=technicalStatus==='passed'?'automated_verification_complete_visual_review_pending':'automated_verification_'+technicalStatus+'_visual_review_pending';
            priorResult.runtime_manifest='execucao/manifesto.json';
            priorResult.summary.fresh_browser_checks=actual;
            priorResult.summary.fresh_technical_failures=failed;
            priorResult.summary.fresh_visual_reviews=0;
            priorResult.execution_location='GitHub Actions; local environment remains unavailable';
            for(const row of priorResult.chapters) {
              const checks=byChapter.get(row.id)||[];
              row.fresh_browser_verification=checks.length===12?(checks.every(c=>c.passed)?'passed':'findings'):'incomplete';
              row.runtime_configurations=checks;
              row.fresh_visual_review='pending_review_of_fresh_captures';
            }
            fs.writeFileSync(path.join(root,'resultado-613.json'),JSON.stringify(priorResult,null,2)+'\n');
            const sheetEntries=gallery.map((g,i)=>'### Folha '+i+' — '+g.width+' px / '+g.theme+'\n\n'+g.ids.map(id=>'- '+id).join('\n')+'\n\n![Folha '+i+']('+g.path+')\n').join('\n');
            fs.writeFileSync(path.join(root,'GALERIA.md'),'# Capturas atuais para revisão visual\n\nFonte: '+process.env.AUDIT_SOURCE_SHA+'; execução '+process.env.AUDIT_RUN_ID+'. As folhas mostram as aberturas em movimento reduzido. Ainda não representam aprovação estética ou pedagógica. Amplie figuras quando houver dúvida; capturas completas estão nos artefatos da execução.\n\n'+sheetEntries);
            const priorReadme=fs.readFileSync(path.join(root,'README.md'),'utf8');
            const table=configurations.map(c=>'| '+c.width+' | '+c.theme+' | '+c.motion+' | '+c.actual+' | '+c.passed+' | '+c.failed+' | '+(c.complete?'sim':'não')+' |').join('\n');
            const section='# Execução remota dos 613 capítulos — Awesome Design MD\n\n'+
              '**Estado técnico: '+technicalStatus+'. Revisão visual das capturas: pendente.**\n\n'+
              'Gerado em '+now+'. SHA verificado: `'+process.env.AUDIT_SOURCE_SHA+'`. [Execução no GitHub Actions]('+manifest.run_url+').\n\n'+
              'Foram obtidos '+actual+' resultados dos 7.356 previstos, com '+failed+' reprovações automáticas. A cobertura completa exige 613 IDs únicos em cada uma das 12 configurações.\n\n'+
              '| Largura | Tema | Movimento | Resultados | Aprovados técnicos | Reprovados | Completa |\n|---|---|---|---:|---:|---:|---|\n'+table+'\n\n'+
              '[Manifesto e limites](execucao/manifesto.json) · [Resultado por capítulo](resultado-613.json) · [Galeria atual](GALERIA.md).\n\n'+
              'O roteiro verifica carregamento da cena nativa, objeto, overflow da página, áreas de controles de 44 px, IDs/referências SVG, loops de animação detectáveis em movimento reduzido, seleção por teclado, extremos do primeiro slider, preservação dos controles ao comparar, conceitos/inspetor e modos Testar/Reconstruir. Os resultados completos estão nos arquivos por configuração.\n\n'+
              'As configurações usam Chromium e preferências sintéticas. Não são prova de funcionamento em Safari/iPad físico, serviços autenticados reais, todos os valores dos controles ou aprovação pedagógica. O inventário formal permanece inalterado. O critério visual usa Claude e Miro do Awesome Design MD, adaptados à identidade existente do Crivo.\n\n'+
              'A falha do ambiente local foi contornada pela execução remota. As folhas de contato ficam versionadas; as capturas individuais completas permanecem nos artefatos com retenção de três dias. A proposta segue em rascunho até analisar os achados e revisar as imagens; sem merge automático.\n\n'+
              '## Registro anterior à execução remota\n\n'+priorReadme.replace(/^# /,'### ');
            fs.writeFileSync(path.join(root,'README.md'),section);
            const continuityPath='docs/CRIVO-CONTINUIDADE.md';
            const continuity=fs.readFileSync(continuityPath,'utf8');
            const intro='## Auditoria automatizada executada no GitHub — '+now+'\n\n'+
              'Fonte: `'+process.env.AUDIT_SOURCE_SHA+'`; execução '+process.env.AUDIT_RUN_ID+'. Estado técnico: '+technicalStatus+'; '+actual+' de 7.356 resultados; '+failed+' reprovações. [Relatório atual](verificacao-awesome-613-2026-10-09/README.md), [manifesto](verificacao-awesome-613-2026-10-09/execucao/manifesto.json) e [capturas para revisão](verificacao-awesome-613-2026-10-09/GALERIA.md).\n\n'+
              'A execução remota contorna o bloqueio local. O código de produto permanece na base da main após #290; diferenças de branch nesta retomada são documentação e infraestrutura de auditoria. Aprovação estética/pedagógica não foi inferida dos testes. Os 81 estados em validação e os 532 não revisados do inventário formal foram preservados.\n\n'+
              'Próximo passo: analisar os achados por ID e revisar as capturas com os critérios Awesome Design MD; depois concluir a revisão da PR #291. Não repetir a execução se o código não mudar e não houver falha ou dúvida nova. Não reaplicar #288/#289/#290. Sem merge automático.\n\n';
            fs.writeFileSync(continuityPath,continuity.replace(/^# CRIVO — continuidade operacional\n/,'# CRIVO — continuidade operacional\n\n'+intro));
            console.log('CRIVO_PERSISTED_SUMMARY '+JSON.stringify({manifest:root+'/execucao/manifesto.json',technicalStatus,complete,actual,failed,configurations,sheets:gallery.length,formal}));
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Salvar evidências na branch de revisão
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verificacao-awesome-613-2026-10-09/ docs/CRIVO-CONTINUIDADE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: preserva execução integral e capturas dos 613 capítulos'
          git push origin HEAD:docs/verificacao-integral-awesome-2026-10-09
      - name: Preservar relatório em caso de falha na publicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crivo-integral-relatorio-consolidado
          path: |
            docs/verificacao-awesome-613-2026-10-09/
            docs/CRIVO-CONTINUIDADE.md
          retention-days: 14
