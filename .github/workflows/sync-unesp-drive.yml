name: Sincronizar UNESP do Drive

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_unesp_drive.py"
      - ".github/workflows/sync-unesp-drive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdown
      - run: python scripts/sync_unesp_drive.py
      - run: |
          git config user.name "JUJU Provas Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "provas brutas/UNESP"
          git diff --cached --quiet || git commit -m "Adiciona provas UNESP 2023-2026"
          git push
