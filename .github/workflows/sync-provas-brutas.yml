name: Sincronizar provas brutas

on:
  # O gatilho por push voltou: a proteção contra inchar o histórico é a
  # verificação de ponteiro LFS no passo de commit, não o gatilho desligado.
  # Se um PDF entrar como binário cru, o job falha e nada é commitado.
  push:
    branches: [main]
    paths:
      - "scripts/sync_provas_brutas.py"
      - ".github/workflows/sync-provas-brutas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Sem lfs: true de propósito — o checkout traria os objetos LFS do
      # repositório inteiro (hoje ~2,5 GB) a cada execução, consumindo banda
      # à toa. O job apenas acrescenta PDFs novos, e o filtro do LFS é
      # aplicado no git add; ponteiros no working tree bastam.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests gdown

      - name: Baixar PDFs oficiais
        run: python scripts/sync_provas_brutas.py

      - name: Ativar Git LFS
        run: git lfs install --local

      - name: Commitar PDFs
        run: |
          git config user.name "JUJU Provas Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "provas brutas"
          # Aborta se algum PDF entrou como binário cru em vez de ponteiro LFS.
          # Sem isso, cada execução engorda o histórico de forma permanente:
          # apagar o arquivo depois não recupera o espaço.
          # -z porque o caminho tem espaço ("provas brutas").
          git diff --cached --name-only -z -- "provas brutas" \
            | while IFS= read -r -d '' f; do
                case "$f" in *.pdf|*.PDF) ;; *) continue ;; esac
                if ! git show ":$f" | head -c 20 | grep -q "^version https"; then
                  echo "ERRO: $f entrou como binário cru, não como ponteiro LFS." >&2
                  echo "Confira o padrão em .gitattributes e se o git-lfs está ativo." >&2
                  exit 1
                fi
              done || exit 1
          if git diff --cached --quiet; then
            echo "Nenhum PDF novo."
          else
            git commit -m "Adiciona provas oficiais FUVEST 2023-2026"
            git push
          fi
