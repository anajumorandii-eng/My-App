name: CI

on:
  pull_request:
  push:
    branches: [main]

# O CI só lê o repositório; o token não precisa de escrita em nada.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci respeita o package-lock.json commitado, então o CI instala
      # exatamente as mesmas versões que o Dockerfile de produção.
      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - name: Continuidade do catálogo e conteúdo editorial
        run: npx vitest run src/data/continuityGeography.test.ts

      # Sem este passo uma quebra de build só aparecia no deploy.
      - run: npm run build

      # Exercita a versão empacotada e o modo de toque com o Chrome do runner.
      - name: Navegação e retomada no iPad
        env:
          NODE_ENV: production
          PORT: '3003'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3003
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          PLAYWRIGHT_OUTPUT_DIR: /tmp/crivo-e2e-artifacts
          PLAYWRIGHT_HTML_OUTPUT_DIR: /tmp/crivo-e2e-report
        run: |
          npm start > /tmp/crivo-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 20 --retry-delay 1 --retry-all-errors --max-time 2 http://127.0.0.1:3003/api/health
          npm run test:e2e:crivo -- --project=desktop --grep 'Hoje|reduced motion|theme keeps|Discordo|every production route|avoids expensive'
          CRIVO_HG_IDS=summary-historia-a-primeira-globalizacao,summary-historia-europa-no-seculo-xix,summary-historia-imperialismo-e-belle-epoque,summary-historia-primeira-guerra-mundial-1914-1918,summary-historia-o-periodo-entreguerras-1918-1939,summary-historia-o-nazismo-na-alemanha,summary-historia-segunda-guerra-mundial-1939-1945,summary-historia-guerra-fria,summary-historia-a-montagem-da-colonizacao,summary-historia-dinamica-interna-da-colonizacao,summary-historia-brasil-imperio-o-declinio-do-segundo-reinado,summary-historia-ascensao-e-dominio-das-oligarquias,summary-historia-a-era-vargas,summary-historia-a-era-vargas-o-estado-novo,summary-historia-republica-liberal-1945-1964-desenvolvimentismo-e-populismo,summary-historia-regime-militar-1964-1985-ii,summary-historia-o-brasil-atual npx playwright test tests/e2e/visual-entrega-hg.spec.ts --project=desktop
