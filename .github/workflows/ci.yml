name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci respeita o package-lock.json commitado, então o CI instala
      # exatamente as mesmas versões que o Dockerfile de produção.
      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      # Sem este passo uma quebra de build só aparecia no deploy.
      - run: npm run build
