name: CI

on:
  pull_request:
  push:
    branches: [main]

# O CI só lê o repositório; o token não precisa de escrita em nada.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci respeita o package-lock.json commitado, então o CI instala
      # exatamente as mesmas versões que o Dockerfile de produção.
      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - name: Continuidade do catálogo e conteúdo editorial
        run: npx vitest run src/data/continuityGeography.test.ts

      # Sem este passo uma quebra de build só aparecia no deploy.
      - run: npm run build

      # Exercita a versão empacotada e o modo de toque com o Chrome do runner.
      - name: Navegação e retomada no iPad
        env:
          NODE_ENV: production
          PORT: '3003'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3003
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          PLAYWRIGHT_OUTPUT_DIR: /tmp/crivo-e2e-artifacts
          PLAYWRIGHT_HTML_OUTPUT_DIR: /tmp/crivo-e2e-report
        run: |
          npm start > /tmp/crivo-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 20 --retry-delay 1 --retry-all-errors --max-time 2 http://127.0.0.1:3003/api/health
          npm run test:e2e:crivo -- --project=desktop --grep 'Hoje|reduced motion|theme keeps|Discordo|every production route|avoids expensive'
          CRIVO_HG_IDS=summary-historia-introducao-a-historia-e-primeiras-civilizacoes,summary-historia-antiguidade-classica-o-mundo-grego,summary-historia-antiguidade-classica-o-mundo-romano,summary-historia-alta-idade-media-e-feudalismo,summary-historia-baixa-idade-media,summary-historia-america-espanhola,summary-historia-vida-urbana-e-renascimento-cultural,summary-historia-reforma-religiosa,summary-historia-absolutismo,summary-historia-iluminismo,summary-geografia-coordenadas-geograficas,summary-geografia-movimentos-da-terra,summary-geografia-sistema-de-fusos-horarios,summary-geografia-linguagem-cartografica,summary-geografia-projecoes-cartograficas,summary-geografia-cartografia-digital,summary-geografia-representacoes-graficas-e-cartograficas,summary-geografia-dinamica-climatica,summary-geografia-clima-mundial,summary-geografia-geomorfologia-mundial,summary-geografia-biogeografia-mundial,summary-geografia-agua-na-superficie-terrestre,summary-geografia-desafios-ambientais-do-seculo-xxi,summary-geografia-geopolitica-ambiental,summary-geografia-geopolitica-dos-recursos-hidricos,summary-geografia-hidrogeografia-mundial,summary-geografia-do-mundo-bipolar-ao-multipolar,summary-geografia-globalizacao-e-processos-economicos-atuais,summary-geografia-geografia-das-redes-mundiais,summary-geografia-unilateralismo-e-multilateralismo npx playwright test tests/e2e/visual-entrega-hg.spec.ts --project=desktop
