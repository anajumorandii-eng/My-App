<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#F4F0E8"/>
  <text x="70" y="72" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#6C1F38">CRIVO · MAPA ADAPTATIVO</text>
  <text x="70" y="120" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#292321">Onde o mapa deve viver no sistema?</text>
  <text x="70" y="154" font-family="Arial,sans-serif" font-size="17" fill="#6E625C">Três arquiteturas para integrar diagnóstico, prioridade e ação.</text>

  <g transform="translate(70 205)">
    <rect width="400" height="585" rx="22" fill="#FFFCF6" stroke="#D8CBBE" stroke-width="2"/>
    <text x="28" y="46" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#6C1F38">A · MAPA COMO CENTRO</text>
    <rect x="28" y="72" width="344" height="330" rx="18" fill="#F8F2E9" stroke="#E2D5C9"/>
    <rect x="110" y="100" width="180" height="58" rx="14" fill="#FFFCF6" stroke="#6C1F38" stroke-width="3"/>
    <text x="200" y="125" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#292321">Óptica</text>
    <text x="200" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="#6E625C">42% consolidado</text>
    <path d="M200 158 V185 M200 185 H103 V210 M200 185 H297 V210" fill="none" stroke="#B9A99C" stroke-width="2"/>
    <rect x="50" y="210" width="106" height="70" rx="12" fill="#FFF9EE" stroke="#C9913B" stroke-width="2"/>
    <text x="103" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#805A21">GARGALO</text><text x="103" y="260" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">Sinais</text>
    <rect x="244" y="210" width="106" height="70" rx="12" fill="#F2F8F3" stroke="#36745A" stroke-width="2"/>
    <text x="297" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#36745A">DOMINADO</text><text x="297" y="260" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">Equações</text>
    <rect x="50" y="305" width="106" height="70" rx="12" fill="#FFFCF6" stroke="#8A7B71" stroke-dasharray="5 5" stroke-width="2"/>
    <text x="103" y="330" text-anchor="middle" font-family="Arial" font-size="11" fill="#6E625C">AVALIAR</text><text x="103" y="355" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">Lentes</text>
    <rect x="244" y="305" width="106" height="70" rx="12" fill="#FFF9EE" stroke="#C9913B" stroke-width="2"/>
    <text x="297" y="330" text-anchor="middle" font-family="Arial" font-size="11" fill="#805A21">INSTÁVEL</text><text x="297" y="355" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">Gráficos</text>
    <text x="28" y="445" font-family="Georgia,serif" font-size="23" font-weight="700" fill="#292321">Exploração primeiro</text>
    <text x="28" y="480" font-family="Arial" font-size="15" fill="#6E625C"><tspan x="28" dy="0">O estudante entra pela matéria e</tspan><tspan x="28" dy="23">navega pelo próprio mapa.</tspan></text>
    <text x="28" y="548" font-family="Arial" font-size="14" font-weight="700" fill="#805A21">Risco</text>
    <text x="28" y="575" font-family="Arial" font-size="14" fill="#6E625C"><tspan x="28">Exige que o estudante decida demais</tspan><tspan x="28" dy="21">quando justamente está perdido.</tspan></text>
  </g>

  <g transform="translate(520 205)">
    <rect width="400" height="585" rx="22" fill="#FFFCF6" stroke="#D8CBBE" stroke-width="2"/>
    <text x="28" y="46" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#6C1F38">B · SESSÃO COMO CENTRO</text>
    <rect x="28" y="72" width="344" height="330" rx="18" fill="#F8F2E9" stroke="#E2D5C9"/>
    <text x="52" y="112" font-family="Arial" font-size="11" font-weight="700" fill="#6C1F38">PRÓXIMA AÇÃO · 18 MIN</text>
    <text x="52" y="148" font-family="Georgia" font-size="24" font-weight="700" fill="#292321">Corrigir convenção</text>
    <text x="52" y="177" font-family="Georgia" font-size="24" font-weight="700" fill="#292321">de sinais</text>
    <text x="52" y="215" font-family="Arial" font-size="13" fill="#6E625C"><tspan x="52">Esse gargalo explica 3 dos seus</tspan><tspan x="52" dy="20">5 erros recentes em óptica.</tspan></text>
    <rect x="52" y="270" width="296" height="8" rx="4" fill="#E6D9CD"/><rect x="52" y="270" width="190" height="8" rx="4" fill="#6C1F38"/>
    <rect x="52" y="307" width="160" height="48" rx="12" fill="#6C1F38"/>
    <text x="132" y="337" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">Iniciar intervenção</text>
    <text x="28" y="445" font-family="Georgia,serif" font-size="23" font-weight="700" fill="#292321">Decisão primeiro</text>
    <text x="28" y="480" font-family="Arial" font-size="15" fill="#6E625C"><tspan x="28">O motor escolhe a próxima ação e</tspan><tspan x="28" dy="23">mostra apenas o contexto necessário.</tspan></text>
    <text x="28" y="548" font-family="Arial" font-size="14" font-weight="700" fill="#805A21">Risco</text>
    <text x="28" y="575" font-family="Arial" font-size="14" fill="#6E625C"><tspan x="28">É eficiente, mas pode esconder a</tspan><tspan x="28" dy="21">visão geral e reduzir autonomia.</tspan></text>
  </g>

  <g transform="translate(970 205)">
    <rect width="400" height="585" rx="22" fill="#FFFCF6" stroke="#6C1F38" stroke-width="4"/>
    <rect x="234" y="24" width="138" height="30" rx="15" fill="#6C1F38"/>
    <text x="303" y="44" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#FFFFFF">RECOMENDADO</text>
    <text x="28" y="46" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#6C1F38">C · SISTEMA HÍBRIDO</text>
    <rect x="28" y="72" width="344" height="330" rx="18" fill="#F8F2E9" stroke="#E2D5C9"/>
    <rect x="48" y="98" width="126" height="190" rx="14" fill="#FFFCF6" stroke="#D8CBBE"/>
    <text x="63" y="126" font-family="Arial" font-size="10" font-weight="700" fill="#6C1F38">AGORA</text>
    <text x="63" y="151" font-family="Arial" font-size="15" font-weight="700">Sinais em</text><text x="63" y="171" font-family="Arial" font-size="15" font-weight="700">óptica</text>
    <text x="63" y="201" font-family="Arial" font-size="10" fill="#6E625C">Intervenção curta</text>
    <rect x="63" y="226" width="96" height="38" rx="9" fill="#6C1F38"/><text x="111" y="250" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="white">Estudar 12 min</text>
    <rect x="190" y="98" width="162" height="190" rx="14" fill="#FFFCF6" stroke="#D8CBBE"/>
    <rect x="213" y="120" width="116" height="35" rx="9" fill="#FFF9EE" stroke="#6C1F38" stroke-width="2"/><text x="271" y="142" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">Óptica</text>
    <rect x="210" y="174" width="122" height="27" rx="7" fill="#FFF9EE" stroke="#C9913B"/><text x="271" y="192" text-anchor="middle" font-family="Arial" font-size="10">Sinais · prioridade</text>
    <rect x="210" y="211" width="122" height="27" rx="7" fill="#F2F8F3" stroke="#36745A"/><text x="271" y="229" text-anchor="middle" font-family="Arial" font-size="10">Equações · domínio</text>
    <rect x="210" y="248" width="122" height="27" rx="7" fill="#FFFCF6" stroke="#8A7B71" stroke-dasharray="4 4"/><text x="271" y="266" text-anchor="middle" font-family="Arial" font-size="10">Lentes · avaliar</text>
    <rect x="48" y="312" width="304" height="64" rx="12" fill="#EEE1D5"/>
    <text x="63" y="338" font-family="Arial" font-size="11" font-weight="700" fill="#6C1F38">POR QUE ISSO?</text>
    <text x="63" y="358" font-family="Arial" font-size="11" fill="#5F514B">O plano e o mapa usam as mesmas evidências.</text>
    <text x="28" y="445" font-family="Georgia,serif" font-size="23" font-weight="700" fill="#292321">Visão + decisão</text>
    <text x="28" y="480" font-family="Arial" font-size="15" fill="#6E625C"><tspan x="28">O mapa tem espaço próprio e também</tspan><tspan x="28" dy="23">alimenta a tela Hoje e as intervenções.</tspan></text>
    <text x="28" y="548" font-family="Arial" font-size="14" font-weight="700" fill="#36745A">Vantagem</text>
    <text x="28" y="575" font-family="Arial" font-size="14" fill="#6E625C"><tspan x="28">Une autonomia e orientação sem</tspan><tspan x="28" dy="21">transformar o mapa em decoração.</tspan></text>
  </g>

  <text x="720" y="845" text-anchor="middle" font-family="Arial" font-size="16" fill="#6E625C">Qual estrutura representa melhor o CRIVO que você quer construir?</text>
</svg>
