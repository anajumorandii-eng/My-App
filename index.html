<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBF8F2" id="theme-color-meta" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Newsreader carries headings, the daily greeting and salient numbers;
         Inter stays the workhorse for navigation, controls and data. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve and apply the theme before first paint so there is no
      // light->dark flash. Mirrors src/design-system/theme.ts's
      // resolveInitialTheme() — kept tiny and dependency-free on purpose
      // because it must run synchronously, before any module loads.
      (function () {
        try {
          var stored = localStorage.getItem('crivo_theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.getElementById('theme-color-meta')?.setAttribute('content', theme === 'dark' ? '#10251F' : '#FBF8F2');
        } catch (e) {
          // localStorage/matchMedia unavailable (e.g. privacy mode) — fall
          // back to light, same as a stored value of "light" would.
        }
      })();
    </script>
    <!-- Light is the fallback for browsers that ignore `media` on these
         link tags; iOS 18+ and current desktop browsers pick the variant
         matching the system theme. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" href="/apple-touch-icon-dark.png" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icon-192-dark.png" media="(prefers-color-scheme: dark)" />
    <!-- Required for iOS to launch as a standalone app and expose the Web
         Push API — Safari only grants push permission to apps added to the
         Home Screen, never to a regular browser tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Crivo" />
    <title>Crivo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
